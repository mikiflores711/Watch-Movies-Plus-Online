let tvDetails=null;async function renderSeason(n){episodeGrid.innerHTML='<div class="loading-note">Cargando episodios…</div>';try{const season=await TMDB.season(84958,n);episodeGrid.innerHTML=(season.episodes||[]).map((ep,i)=>{const src=LINKS[n]?.[i]||'';const still=TMDB.image(ep.still_path,'w780')||heroImage.src;return `<button class="episode-card" data-src="${src}" data-title="Loki T${n} E${ep.episode_number}: ${ep.name}" data-poster="${still}" ${src?'':'disabled'}><div class="episode-still"><img src="${still}" alt="${ep.name}"><span class="duration">${ep.runtime?ep.runtime+' min':''}</span></div><h3>${ep.episode_number}. ${ep.name}</h3><p>${ep.overview||'Sin descripción disponible.'}</p></button>`}).join('');episodeGrid.querySelectorAll('.episode-card[data-src]').forEach(btn=>btn.onclick=()=>openWmpPlayer({src:btn.dataset.src,poster:btn.dataset.poster,title:btn.dataset.title}));}catch(e){episodeGrid.innerHTML='<div class="error">No se pudieron consultar los episodios en TMDB.</div>';}}
async function load(){try{const {details,credits:c}=await TMDB.tv(84958);tvDetails=details;title.textContent=details.name;overview.textContent=details.overview||'Sin descripción disponible.';meta.textContent=`${(details.first_air_date||'').slice(0,4)} · ${details.number_of_seasons} temporadas · ${(details.genres||[]).map(g=>g.name).join(' · ')}`;const hero=TMDB.image(details.backdrop_path||details.poster_path,'original');if(hero)heroImage.src=hero;const actors=(c.cast||[]).slice(0,5);cast.innerHTML=actors.map(p=>`<article class="cast-card"><img src="${TMDB.image(p.profile_path,'w300')||''}" alt="${p.name}"><div class="cast-copy"><strong>${p.name}</strong><small>${p.character||''}</small></div></article>`).join('');credits.innerHTML=`<strong>Elenco:</strong> ${actors.slice(0,3).map(p=>p.name).join(', ')}<br><strong>Creadores:</strong> ${(details.created_by||[]).map(p=>p.name).join(', ')||'No disponible'}`;}catch(e){overview.textContent='No se pudo cargar la información de TMDB.';}renderSeason(1);}seasonSelect.onchange=()=>renderSeason(Number(seasonSelect.value));load();
</script></body></html>
