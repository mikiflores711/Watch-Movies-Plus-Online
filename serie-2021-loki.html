<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f10"><title>Loki</title><link rel="preconnect" href="https://archive.org"><link rel="preconnect" href="https://image.tmdb.org"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vidstack@1.12.13/player/styles/default/theme.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vidstack@1.12.13/player/styles/default/layouts/video.min.css"><link rel="stylesheet" href="assets/css/site.css"><script type="module" src="https://cdn.jsdelivr.net/npm/vidstack@1.12.13/cdn/with-layouts/vidstack.js"></script></head><body>

<main class="detail-page" data-kind="tv" data-tmdb-id="84958"><section class="detail-hero"><div id="heroBg" class="detail-hero-bg" style="background-image:url('https://image.tmdb.org/t/p/original/voHUmluYmKyleFkTu3lOXQG702u.jpg')"></div><div class="detail-hero-content"><img id="titleLogo" class="title-logo hidden" alt="Logo de Loki"><h1 id="fallbackTitle" class="fallback-title">Loki</h1><div id="meta" class="hero-meta"><span>2021</span><span>2 temporadas</span><span>Drama</span></div><p id="overview" class="hero-overview">Cargando información…</p><div id="credits" class="hero-credits"></div></div></section><div class="content-wrap"><section class="episodes"><div class="episodes-head"><h2>Episodios</h2><select id="seasonSelect" class="season-select"><option value="1">Temporada 1</option><option value="2">Temporada 2</option></select></div><div class="episode-rail-wrap"><button id="prevEpisodes" class="rail-arrow prev" aria-label="Episodios anteriores">‹</button><div id="episodeGrid" class="episode-rail"><div class="loading-note">Cargando episodios…</div></div><button id="nextEpisodes" class="rail-arrow next" aria-label="Episodios siguientes">›</button></div></section><section class="cast-section"><h2>Reparto de la serie</h2><div id="cast" class="cast-grid"></div></section><p class="tmdb-note">Información e imágenes proporcionadas por TMDB.</p></div></main>

const LINKS={1:['https://archive.org/download/tg_c6aacf687522472ab5db3a239d1e739e/nnDPBi2O5yDY.mp4','https://archive.org/download/tg_12309fd465634064b5ce53fad4053d58/3dWmThEtxt3S.mp4','https://archive.org/download/tg_09a7382ba377446b9d4c41e42620df05/bAHZzRknm2lH.mp4','https://archive.org/download/tg_1a9a438a1fcb40a7868169c878f7e547/58hX48wl0GQL.mp4','https://archive.org/download/tg_0ab76e38990e499fa0a697e4658a48b9/bWYRpgGtD53m.mp4','https://archive.org/download/tg_18ac119652074c86bd811cd40dba9461/wUHuUhuFgmLr.mp4'],2:['https://archive.org/download/tg_7fb18b95f68d4778b663e82328070af3/ibOXTojNhCqy.mp4','https://archive.org/download/tg_aff02f849b5d46e98d34624a8638e1f9/1iRfVGEQDQD0.mp4','https://archive.org/download/tg_19eeeb5a4c8c4e09ba69621b0d0bd2d5/uRH8LraCgAYU.mp4','https://archive.org/download/tg_968bad26af2d4e498cca19ff610369a6/Moa5PCxg39Lb.mp4','https://archive.org/download/tg_f5a5002834bd4b6d8b8a398938471689/XHYOZ36YM3Sq.mp4','https://archive.org/download/tg_9efa64730df64ab195935e8e16939d04/DfsXq0LRA9kj.mp4']};
let seriesPoster='https://image.tmdb.org/t/p/original/voHUmluYmKyleFkTu3lOXQG702u.jpg';
async function renderSeason(n){episodeGrid.innerHTML='<div class="loading-note">Cargando episodios…</div>';try{const season=await TMDB.season(84958,n);episodeGrid.innerHTML=(season.episodes||[]).map((ep,i)=>{const src=LINKS[n]?.[i]||'';const still=TMDB.image(ep.still_path,'w780')||seriesPoster;return `<button class="episode-card" data-src="${src}" data-title="Loki T${n} E${ep.episode_number}: ${ep.name}" data-poster="${still}" ${src?'':'disabled'}><div class="episode-still"><img src="${still}" alt="${ep.name}"><span class="duration">${ep.runtime?ep.runtime+' min':''}</span></div><div class="episode-copy"><h3>${ep.episode_number}. ${ep.name}</h3><p>${ep.overview||'Sin descripción disponible.'}</p></div></button>`}).join('');episodeGrid.querySelectorAll('.episode-card[data-src]').forEach(btn=>btn.onclick=()=>openWmpPlayer({src:btn.dataset.src,poster:btn.dataset.poster,title:btn.dataset.title,contentTitle:'Loki',contentId:'loki-2021',kind:'serie',season:n,episode:btn.dataset.title.match(/E(\d+)/)?.[1]||'',server:'Internet Archive'}));episodeGrid.scrollTo({left:0,behavior:'smooth'});}catch(e){episodeGrid.innerHTML='<div class="error">No se pudieron consultar los episodios en TMDB.</div>';}}
async function load(){try{const {details,credits:c,images}=await TMDB.tv(84958);fallbackTitle.textContent=details.name;overview.textContent=details.overview||'Sin descripción disponible.';meta.innerHTML=`<span>${(details.first_air_date||'').slice(0,4)}</span><span>${details.number_of_seasons} temporadas</span><span>${(details.genres||[]).map(g=>g.name).join(' · ')}</span>`;seriesPoster=TMDB.image(details.backdrop_path||details.poster_path,'original')||seriesPoster;heroBg.style.backgroundImage=`url('${seriesPoster}')`;const logo=TMDB.pickLogo(images);if(logo){titleLogo.src=TMDB.image(logo.file_path,'w500');titleLogo.classList.remove('hidden');fallbackTitle.classList.add('hidden')}const actors=(c.cast||[]).slice(0,10);cast.innerHTML=actors.map(p=>`<article class="cast-card"><img src="${TMDB.image(p.profile_path,'w300')||''}" alt="${p.name}"><div class="cast-copy"><strong>${p.name}</strong><small>${p.character||''}</small></div></article>`).join('');credits.innerHTML=`<strong>Elenco:</strong> ${actors.slice(0,4).map(p=>p.name).join(', ')}<br><strong>Creadores:</strong> ${(details.created_by||[]).map(p=>p.name).join(', ')||'No disponible'}`;}catch(e){overview.textContent='No se pudo cargar la información de TMDB.';}renderSeason(1);}seasonSelect.onchange=()=>renderSeason(Number(seasonSelect.value));prevEpisodes.onclick=()=>episodeGrid.scrollBy({left:-episodeGrid.clientWidth*.86,behavior:'smooth'});nextEpisodes.onclick=()=>episodeGrid.scrollBy({left:episodeGrid.clientWidth*.86,behavior:'smooth'});load();
</script></body></html>
