<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador V3</title><link rel="stylesheet" href="assets/css/app.css"><style>.gen{width:min(850px,100%);margin:auto;padding:30px 20px}.gen textarea,.gen input,.gen select{width:100%;margin:7px 0 15px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#121917;color:#fff}.gen button{padding:13px 18px;border:0;border-radius:10px;background:#e50914;color:#fff;font-weight:900}.out{white-space:pre-wrap;background:#0b100e;padding:18px;border-radius:12px;margin-top:18px}</style></head><body><main class="gen"><h1>Generador Watch Movies Plus V3</h1><p>Genera un bloque para agregarlo en <code>assets/js/content-data.js</code>.</p><label>Tipo</label><select id="type"><option value="movie">Película</option><option value="tv">Serie</option></select><label>ID interno</label><input id="id" placeholder="ejemplo: avatar-2009"><label>ID de información</label><input id="tmdb" type="number"><label>Título</label><input id="title"><label>Año</label><input id="year" type="number"><label>Géneros</label><input id="genre"><label>Descripción</label><textarea id="desc"></textarea><label>Poster</label><input id="poster"><label>Fondo</label><input id="backdrop"><label>Enlaces MP4 (uno por línea; en series usa una temporada por bloque)</label><textarea id="links" rows="10"></textarea><button id="make">Generar bloque</button><pre id="out" class="out"></pre></main><script>make.onclick=()=>{const arr=links.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const base={id:id.value.trim(),type:type.value,tmdbId:Number(tmdb.value),title:title.value.trim(),year:Number(year.value),genre:genre.value.trim(),description:desc.value.trim(),poster:poster.value.trim(),backdrop:backdrop.value.trim()};if(type.value==='movie')base.video=arr[0]||'';else base.seasons={1:arr};out.textContent=JSON.stringify(base,null,2)+','}</script></body></html>
