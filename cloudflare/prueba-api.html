<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba API</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px;background:#111;color:#fff}button{padding:12px 16px}pre{white-space:pre-wrap;background:#222;padding:14px;border-radius:10px}</style></head><body><h1>Prueba Watch Movies Plus API</h1><button id="health">Probar conexión</button> <button id="report">Enviar reporte de prueba</button><pre id="out"></pre><script>const API='https://watch-movies-plus-api.mikimc-business.workers.dev';const out=document.querySelector('#out');async function call(path,opt){try{const r=await fetch(API+path,opt),j=await r.json();out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent=e.stack||e.message}}document.querySelector('#health').onclick=()=>call('/api/health');document.querySelector('#report').onclick=()=>call('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'pelicula',titulo:'Río',contenidoId:'rio-2011',anio:'2011',temporada:'',episodio:'',tituloEpisodio:'',servidor:'Servidor principal',video:'https://archive.org/ejemplo.mp4',problema:'Reporte de prueba',comentario:'Creado desde prueba-api.html',pagina:location.href,userAgent:navigator.userAgent})});</script></body></html>
