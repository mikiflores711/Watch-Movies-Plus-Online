const VIDEO='https://archive.org/download/tg_1621b2eef1b545e18a8f7d9fcd0a8958/0UXiak6lWIhW.mp4';
async function load(){let poster=heroBg.style.backgroundImage.slice(5,-2);try{const {details,credits,images}=await TMDB.movie(46195);fallbackTitle.textContent=details.title;overview.textContent=details.overview||'Sin descripción disponible.';meta.innerHTML=`<span>${(details.release_date||'').slice(0,4)}</span><span>${details.runtime||''} min</span><span>${(details.genres||[]).map(g=>g.name).join(' · ')}</span>`;poster=TMDB.image(details.backdrop_path||details.poster_path,'original')||poster;heroBg.style.backgroundImage=`url('${poster}')`;const logo=TMDB.pickLogo(images);if(logo){titleLogo.src=TMDB.image(logo.file_path,'w500');titleLogo.classList.remove('hidden');fallbackTitle.classList.add('hidden')}const actors=(credits.cast||[]).slice(0,10);cast.innerHTML=actors.map(p=>`<article class="cast-card"><img src="${TMDB.image(p.profile_path,'w300')||''}" alt="${p.name}"><div class="cast-copy"><strong>${p.name}</strong><small>${p.character||''}</small></div></article>`).join('');credits.innerHTML=`<strong>Elenco:</strong> ${actors.slice(0,4).map(p=>p.name).join(', ')}`;watchMovie.onclick=()=>openWmpPlayer({src:VIDEO,poster,title:details.title,contentTitle:details.title,contentId:'rio-2011',kind:'película',server:'Internet Archive'});}catch(e){overview.textContent='No se pudo cargar TMDB. La película sigue disponible.';watchMovie.onclick=()=>openWmpPlayer({src:VIDEO,poster,title:'Río',contentTitle:'Río',contentId:'rio-2011',kind:'película',server:'Internet Archive'});}}load();
</script></body></html>
